source = $HOME/.cache/wal/colors-hyprland.conf

general {
    hide_cursor = true
    ignore_empty_input = true
    immediate_render = true
    text_trim = true
    fail_timeout = 2000
}

auth {
    pam:enabled = true
    pam:module = hyprlock
}

animations {
    enabled = true
    bezier = lockscreen, 0.4, 0, 0.2, 1
    animation = fadeIn, 1, 4, lockscreen
    animation = fadeOut, 1, 4, lockscreen
    animation = inputFieldColors, 1, 3, lockscreen
    animation = inputFieldDots, 1, 3, lockscreen
}

background {
    monitor =
    path = $HOME/.current_wallpaper
    color = $background
    blur_passes = 0
    blur_size = 4
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 200, 50
    outline_thickness = 0
    dots_size = 0.05
    dots_spacing = 0.2
    dots_center = true
    dots_rounding = -1

    inner_color = rgba(255,255,255,0.1)
    outer_color = rgba(255,255,255,0.1) $color2 135deg
    font_color = $color2

    fade_on_empty = true
    fade_timeout = 100
    placeholder_text =
    hide_input = false
    rounding = -1
    check_color = $color1
    check_text = 
    fail_color = $color7
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>
    capslock_color = $color9
    numlock_color = -1
    bothlock_color = -1
    invert_numlock = false
    swap_font_color = false

    position = 0, -75
    halign = center
    valign = center
}

# Time
label {
    monitor =
    text = $TIME
    text_align = center
    color = $color2
    font_size = 85
    font_family = JetBrainsMono Nerd Font 10

    position = 0, 75
    halign = center
    valign = center
    shadow_passes = 0
}

# Date
label {
    monitor =
    text = cmd[update:60000] echo "$(date +"%A, %B %d")"
    color = $color2
    font_family = JetBrainsMono Nerd Font 10
    font_size = 25

    position = 0, 0
    halign = center
    valign = center
    shadow_passes = 0
}
